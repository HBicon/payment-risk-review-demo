<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="110" y1="42" x2="1060" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9E6DF"/>
      <stop offset="0.52" stop-color="#DED9D0"/>
      <stop offset="1" stop-color="#CFC8BC"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 300) rotate(90) scale(610 660)">
      <stop stop-color="#FFFDF7" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#FFF9EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFF6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="415" y1="113" x2="788" y2="772" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46504E"/>
      <stop offset="0.22" stop-color="#151A19"/>
      <stop offset="0.72" stop-color="#2A302F"/>
      <stop offset="1" stop-color="#070A09"/>
    </linearGradient>
    <linearGradient id="glass" x1="463" y1="164" x2="741" y2="739" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFCF8"/>
      <stop offset="0.48" stop-color="#F3F5F0"/>
      <stop offset="1" stop-color="#E5EAE2"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="597" y1="158" x2="600" y2="699" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F8FAF6"/>
      <stop offset="1" stop-color="#EFF3EC"/>
    </linearGradient>
    <linearGradient id="reflection" x1="525" y1="260" x2="735" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="phoneShadow" x="268" y="61" width="680" height="807" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="18" dy="34" stdDeviation="32" flood-color="#3F3A32" flood-opacity="0.34"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="24" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="transparentNoise">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="screenClip">
      <rect x="450" y="150" width="302" height="595" rx="35"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#light)"/>
